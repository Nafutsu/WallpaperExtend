plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.wallpaperextend'
    compileSdk 34

    defaultConfig {
        applicationId "com.wallpaperextend"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.github.chrisbanes:photoview:2.3.0'

    // ★ 端侧 AI 推理引擎（NPU / GPU / CPU 自动选择）
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'
}

// ★ 自动从 GitHub Release 下载 LaMa ONNX 模型到 assets/models/
task downloadModel {
    doLast {
        def modelDir = new File("${project.projectDir}/src/main/assets/models")
        modelDir.mkdirs()
        def modelFile = new File(modelDir, "image_extension_lama.onnx")

        if (!modelFile.exists()) {
            println "⬇️ Downloading LaMa ONNX model..."
            ant.get(
                src: 'https://github.com/Nafutsu/WallpaperExtend/releases/download/v1.0.0/lama_fp32.onnx',
                dest: modelFile,
                verbose: true
            )
            println "✅ Model downloaded: ${modelFile.absolutePath}"
        } else {
            println "✅ Model already exists, skip download."
        }
    }
}

preBuild.dependsOn downloadModel
