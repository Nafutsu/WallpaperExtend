name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure gradlew is executable
        run: |
          chmod +x gradlew gradlew.bat || true
          ls -la gradlew

      - name: Build debug APK (with Gradle)
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperExtend-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Diagnose (if build failed)
        if: failure()
        run: |
          echo "--- gradle/wrapper contents ---"
          ls -la gradle/wrapper
          echo "--- root files ---"
          ls -la
          echo "--- app/build.gradle (if exists) ---"
          cat app/build.gradle || true
